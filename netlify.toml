# ============================================================================
#  brokservisavto.com — редиректи та кешування
# ============================================================================

# --- 1. Прибираємо дублі .html ---------------------------------------------
# У Search Console окремо ранжуються /otsinka і /otsinka.html, /dogovir і
# /dogovir.html. Дві URL конкурують між собою за один запит і ділять сигнали.
# Знак "!" примусовий: редирект спрацьовує навіть тоді, коли файл існує.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# --- 2. Кешування на CDN ----------------------------------------------------
# HTML браузер перевіряє щоразу (правки виходять одразу), CDN тримає годину —
# це прибирає повільну першу відповідь із «холодних» edge-вузлів.

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/icons.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lead-forms.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600, s-maxage=86400"
