<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Моніторинг законодавства</title>
<style>
  :root{
    --navy:#0f1e35; --navy-soft:#1b2f4d; --gold:#c9a227;
    --paper:#f6f7f9; --line:#e2e6ec; --ink:#16202f; --muted:#6b7686;
    --auto:#1f6feb; --tax:#137a5a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:20}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--gold)}
  .out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .bar button{border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
  .bar button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:10px}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    font-size:12px;color:var(--muted);margin-bottom:7px}
  .tag{font-weight:600;padding:2px 8px;border-radius:5px;color:#fff;font-size:11px}
  .tag.auto{background:var(--auto)} .tag.tax{background:var(--tax)}
  .card a.t{display:block;color:var(--ink);font-weight:600;
    text-decoration:none;margin-bottom:9px}
  .card a.t:hover{color:var(--auto)}
  .kw{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
  .kw span{background:#fdf6e0;border:1px solid #eadfb8;color:#7a5c00;
    font-size:11px;padding:2px 7px;border-radius:4px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{flex:1;min-width:96px;border:1px solid var(--line);background:#fff;
    border-radius:8px;padding:8px;font-size:13px;cursor:pointer}
  .acts button:hover{border-color:var(--navy)}
  .acts button.done{color:var(--tax)} .acts button.trash{color:#a33}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:24px}
  .login h2{margin:0 0 4px;font-size:18px}
  .login p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .login input{width:100%;border:1px solid var(--line);border-radius:8px;
    padding:11px;font-size:16px;margin-bottom:10px}
  .login button{width:100%;background:var(--navy);color:#fff;border:0;
    border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .err{color:#a33;font-size:13px;margin-top:10px}
  .hide{display:none}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<div id="login" class="login hide">
  <h2>Моніторинг законодавства</h2>
  <p>Вхід тим самим акаунтом, що й у CRM.</p>
  <input id="email" type="email" placeholder="Пошта" autocomplete="username">
  <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="btnLogin">Увійти</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hide">
  <header>
    <h1>Моніторинг <span>законодавства</span></h1>
    <button class="out" id="btnOut">Вийти</button>
  </header>
  <div class="wrap">
    <div class="bar" id="barStatus"></div>
    <div class="bar" id="barCat"></div>
    <div id="list"></div>
  </div>
</div>

<script>
// ── Налаштування ────────────────────────────────────────────
const SUPABASE_URL = 'https://rhduokjaawmorcyiuviy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoZHVva2phYXdtb3JjeWl1dml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDE1NDgsImV4cCI6MjA5NjQxNzU0OH0.usjLWtdJW0OJt8dgUfCnkVljKN6kpG7vJ907Y_XWieg';
// ────────────────────────────────────────────────────────────

const AT = String.fromCharCode(64); // обхід Cloudflare Email Obfuscation
const cdn = 'https://cdn.jsdelivr.net/npm/' + AT + 'supabase/supabase-js' + AT + '2';

let db, state = { status: 'new', cat: 'all', rows: [] };

const STATUSES = [
  ['new', 'Нові'], ['in_work', 'В роботі'], ['done', 'Опрацьовані'],
  ['trash', 'Сміття'], ['all', 'Усі'],
];
const CATS = [['all', 'Усі теми'], ['auto', 'Авто'], ['tax', 'Податки']];

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function boot() {
  const s = document.createElement('script');
  s.src = cdn;
  s.onload = start;
  s.onerror = () => { document.body.innerHTML = '<div class="empty">Не вдалося завантажити бібліотеку Supabase. Перевір з’єднання.</div>'; };
  document.head.appendChild(s);
}

async function start() {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await db.auth.getSession();
  data.session ? openApp() : el('login').classList.remove('hide');

  el('btnLogin').onclick = signIn;
  el('pass').onkeydown = (e) => { if (e.key === 'Enter') signIn(); };
  el('btnOut').onclick = async () => { await db.auth.signOut(); location.reload(); };
}

async function signIn() {
  el('loginErr').textContent = '';
  const { error } = await db.auth.signInWithPassword({
    email: el('email').value.trim(),
    password: el('pass').value,
  });
  if (error) { el('loginErr').textContent = 'Не вийшло увійти: ' + error.message; return; }
  el('login').classList.add('hide');
  openApp();
}

function openApp() {
  el('app').classList.remove('hide');
  drawBars();
  load();
}

function drawBars() {
  el('barStatus').innerHTML = STATUSES.map(([k, l]) =>
    `<button data-s="${k}" class="${state.status === k ? 'on' : ''}">${l}</button>`).join('');
  el('barCat').innerHTML = CATS.map(([k, l]) =>
    `<button data-c="${k}" class="${state.cat === k ? 'on' : ''}">${l}</button>`).join('');
  el('barStatus').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.status = b.dataset.s; drawBars(); load();
  };
  el('barCat').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.cat = b.dataset.c; drawBars(); load();
  };
}

async function load() {
  el('list').innerHTML = '<div class="empty">Завантаження…</div>';
  let q = db.from('news_monitor').select('*').order('created_at', { ascending: false }).limit(200);
  if (state.status !== 'all') q = q.eq('status', state.status);
  if (state.cat !== 'all') q = q.eq('category', state.cat);

  const { data, error } = await q;
  if (error) { el('list').innerHTML = `<div class="empty">Помилка: ${esc(error.message)}</div>`; return; }
  state.rows = data || [];
  render();
}

function render() {
  if (!state.rows.length) {
    el('list').innerHTML = '<div class="empty">Тут порожньо. Наступна перевірка джерел — завтра о 09:00.</div>';
    return;
  }
  el('list').innerHTML = state.rows.map((r) => {
    const date = (r.published_at || r.created_at || '').slice(0, 10);
    const kw = (r.matched || []).map((w) => `<span>${esc(w)}</span>`).join('');
    return `<div class="card">
      <div class="meta">
        <span class="tag ${r.category === 'tax' ? 'tax' : 'auto'}">${r.category === 'tax' ? 'Податки' : 'Авто'}</span>
        <span>${esc(r.source)}</span><span>·</span><span>${esc(date)}</span>
      </div>
      <a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="kw">${kw}</div>
      <div class="acts">
        <button data-id="${r.id}" data-st="in_work">В роботу</button>
        <button class="done" data-id="${r.id}" data-st="done">Опрацьовано</button>
        <button class="trash" data-id="${r.id}" data-st="trash">Сміття</button>
      </div>
    </div>`;
  }).join('');

  el('list').onclick = async (e) => {
    const b = e.target.closest('button[data-st]'); if (!b) return;
    b.disabled = true;
    const { error } = await db.from('news_monitor')
      .update({ status: b.dataset.st }).eq('id', b.dataset.id);
    if (error) { alert('Не збереглося: ' + error.message); b.disabled = false; return; }
    load();
  };
}

boot();
</script>
</body>
</html>
