    {id:"apprcontract",name:"Оцінка + договір",services:["Оцінка + договір"],stages:[
      {name:"Новий лід",color:"#64748b",type:"active"},
      {name:"1-й контакт",color:"#3b82f6",type:"active"},
      {name:"Виготовлення оцінки",color:"#8b5cf6",type:"active"},
      {name:"Договір",color:"#0891b2",type:"active"},
      {name:"Реалізовано",color:"#16a34a",type:"won"},
      {name:"Втрачено / відмова",color:"#dc2626",type:"lost"},
    ]},
  ],
};

const uid = () => Math.random().toString(36).slice(2,9);
const uah = n => (Number(n)||0).toLocaleString("uk-UA")+" грн";
const usd = n => "$"+(Number(n)||0).toLocaleString("uk-UA");
const fdate = ts => new Date(ts).toLocaleDateString("uk-UA",{day:"2-digit",month:"short",year:"2-digit"});
const fdt = ts => ts ? new Date(ts).toLocaleString("uk-UA",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const toLocal = ts => { if(!ts) return ""; const d=new Date(ts), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
/* стан нагадування: od = прострочено, td = сьогодні, ok = у майбутньому */
const naState = l => { if(!l.next_action_at) return null; const d=new Date(l.next_action_at), now=new Date(); if(d<now) return "od"; return d.toDateString()===now.toDateString() ? "td" : "ok"; };
const LOSS_REASONS = ["Дорого / не влаштувала ціна","Обрав конкурента","Передумав / відклав покупку","Не виходить на зв'язок","Не підійшли умови чи строки","Нецільовий лід / спам","Інше"];
const lossBase = r => (r||"").split(" — ")[0];
/* воронки: pipeFor повертає етапи воронки для послуги (або головну воронку) */
const pipeFor = (cfg,service) => { const p=(cfg.pipelines||[]).find(p=>(p.services||[]).includes(service)); return p?p.stages:cfg.stages; };
const allStages = cfg => [...cfg.stages,...(cfg.pipelines||[]).flatMap(p=>p.stages)];
const typeNames = (cfg,t) => [...new Set(allStages(cfg).filter(s=>s.type===t).map(s=>s.name))];
const stOf = (cfg,l) => pipeFor(cfg,l.service).find(s=>s.name===l.stage)||allStages(cfg).find(s=>s.name===l.stage);

/* спільні елементи форм (на верхньому рівні, щоб не перестворювались і не збивали фокус) */
const F = ({l,children,full}) => <label className={"f"+(full?" full":"")}><span>{l}</span>{children}</label>;
const I = ({l,v}) => <div className="info"><span className="l">{l}</span><span className="v">{v}</span></div>;

/* ============================ APP / AUTH ============================ */
function App(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    db.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=db.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return <div className="center"><div style={{textAlign:"center",color:"#64748b"}}><div className="spin" style={{fontSize:34}}>◐</div><p style={{marginTop:10}}>Завантаження…</p></div></div>;
  if(!session) return <Login/>;
  return <Shell session={session}/>;
}

function Login(){
  const [email,setEmail]=useState(""),[pw,setPw]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const submit=async()=>{
    setErr(""); setBusy(true);
    const {error}=await db.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error) setErr("Невірний email або пароль.");
  };
  return <div className="center"><div className="login">
    <div className="logo">🚗</div>
    <h1>BROKSERVISAVTO CRM</h1>
    <p>Вхід для менеджерів</p>
    {err&&<div className="err">{err}</div>}
    <label>Email</label>
    <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="manager@brokservisavto.com"/>
    <label>Пароль</label>
    <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••"/>
    <button onClick={submit} disabled={busy}>{busy?"Вхід…":"Увійти"}</button>
  </div></div>;
}

/* ============================ SHELL ============================ */
function Shell({session}){
  const [leads,setLeads]=useState([]);
  const [cfg,setCfg]=useState(DEFAULT_CONFIG);
  const [view,setView]=useState("dash");
  const [open,setOpen]=useState(null);
  const [add,setAdd]=useState(false);
  const [sync,setSync]=useState("");
  const [ready,setReady]=useState(false);

  const load=async()=>{
    const {data:ld}=await db.from("leads").select("*").order("created_at",{ascending:false});
    setLeads(ld||[]);
    const {data:cf}=await db.from("crm_config").select("data").eq("id",1).maybeSingle();
    if(cf&&cf.data&&cf.data.stages){
      const merged={...DEFAULT_CONFIG,...cf.data};
      if(!Array.isArray(merged.pipelines)||merged.pipelines.some(p=>!p||!p.id||!Array.isArray(p.stages)||!p.stages.length||!Array.isArray(p.services))) merged.pipelines=DEFAULT_CONFIG.pipelines;
      setCfg(merged);
    }
    else { await db.from("crm_config").upsert({id:1,data:DEFAULT_CONFIG}); }
    setSync("Оновлено "+new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}));
    setReady(true);
  };
  const busyRef=useRef(false);
  useEffect(()=>{ busyRef.current = (open!==null)||add; },[open,add]);
  useEffect(()=>{ load(); const t=setInterval(()=>{ if(!busyRef.current) load(); },20000); return ()=>clearInterval(t); },[]);

  const saveCfg=async(next)=>{ setCfg(next); await db.from("crm_config").upsert({id:1,data:next}); };

  const updateLead=async(id,patch,note)=>{
    const cur=leads.find(l=>l.id===id);
    const history=note?[...(cur.history||[]),{ts:Date.now(),text:note}]:(cur.history||[]);
    const row={...patch,history,updated_at:new Date().toISOString()};
    setLeads(ls=>ls.map(l=>l.id===id?{...l,...row}:l));
    await db.from("leads").update(row).eq("id",id);
  };
  const addLead=async(lead)=>{
    let manager_id=lead.manager_id;
    if(!manager_id&&cfg.managers.length){ manager_id=cfg.managers[leads.length%cfg.managers.length].id; }
    const mgr=cfg.managers.find(m=>m.id===manager_id);
    const row={...lead,manager_id,source:lead.source||"CRM",stage:lead.stage||cfg.stages[0].name,
      history:[{ts:Date.now(),text:`Створено вручну${mgr?" · менеджер: "+mgr.name:""}`}]};
    const {data}=await db.from("leads").insert(row).select().single();
    if(data) setLeads(ls=>[data,...ls]);
  };
  const delLead=async(id)=>{ setLeads(ls=>ls.filter(l=>l.id!==id)); await db.from("leads").delete().eq("id",id); };

  /* зміна етапу з перехопленням: якщо етап типу "lost" — питаємо причину */
  const [lossAsk,setLossAsk]=useState(null);
  const requestStage=(id,stage,extraNote)=>{
    const cur=leads.find(l=>l.id===id);
    const st=(cur?pipeFor(cfg,cur.service):cfg.stages).find(s=>s.name===stage)||allStages(cfg).find(s=>s.name===stage);
    if(st&&st.type==="lost"&&cur&&cur.stage!==stage){ setLossAsk({id,stage}); return; }
    updateLead(id,{stage},(extraNote?extraNote+" · ":"")+"Етап → "+stage);
  };
  const confirmLoss=(reason)=>{
    updateLead(lossAsk.id,{stage:lossAsk.stage,loss_reason:reason},"Етап → "+lossAsk.stage+" · Причина: "+reason);
    setLossAsk(null);
  };

  const NAV=[["dash","Дашборд","▦"],["funnel","Воронка","▥"],["leads","Ліди","☰"],["managers","Менеджери","☺"],["settings","Налаштування","⚙"]];
  const cur=open?leads.find(l=>l.id===open):null;

  return <div className="app">
    <aside className="side">
      <div className="brand"><div className="lg">🚗</div><div><b>{cfg.title}</b><span>Автоброкер · оцінка</span></div></div>
      <div className="nav">{NAV.map(([k,l,i])=><button key={k} className={view===k?"on":""} onClick={()=>setView(k)}><span style={{width:18,textAlign:"center"}}>{i}</span>{l}</button>)}</div>
      <button className="btn p" style={{marginTop:8}} onClick={()=>setAdd(true)}>+ Новий лід</button>
      <div className="who">{session.user.email}</div>
      <button className="out" onClick={()=>db.auth.signOut()}>Вийти</button>
    </aside>
    <main className="main">
      <header className="top">
        <h2>{NAV.find(n=>n[0]===view)[1]}</h2>
        <div className="r">
          <span className="sync">{sync}</span>
          <button className="btn g" onClick={load}>↻</button>
          <button className="btn p" onClick={()=>setAdd(true)}>+ Лід</button>
        </div>
      </header>
      <div className="wrap">
        {!ready? <div className="muted">Завантаження даних…</div> :
         view==="dash"? <Dash leads={leads} cfg={cfg} openCard={setOpen}/> :
         view==="funnel"? <Funnel leads={leads} cfg={cfg} requestStage={requestStage} openCard={setOpen}/> :
         view==="leads"? <Leads leads={leads} cfg={cfg} openCard={setOpen}/> :
         view==="managers"? <Managers leads={leads} cfg={cfg} saveCfg={saveCfg} updateLead={updateLead}/> :
         <Settings cfg={cfg} saveCfg={saveCfg}/>}
      </div>
    </main>
    <nav className="bn">{NAV.map(([k,l,i])=><button key={k} className={view===k?"on":""} onClick={()=>setView(k)}><span>{i}</span>{l}</button>)}</nav>
    {cur&&<Card lead={cur} cfg={cfg} onClose={()=>setOpen(null)} updateLead={updateLead} requestStage={requestStage} delLead={id=>{delLead(id);setOpen(null);}}/>}
    {add&&<AddLead cfg={cfg} onClose={()=>setAdd(false)} addLead={l=>{addLead(l);setAdd(false);}}/>}
    {lossAsk&&<LossModal onClose={()=>setLossAsk(null)} onConfirm={confirmLoss}/>}
  </div>;
}

/* ============================ DASHBOARD ============================ */
function Dash({leads,cfg,openCard}){
  const won=typeNames(cfg,"won");
  const lost=typeNames(cfg,"lost");
  const pipes=cfg.pipelines||[];
  const [pid,setPid]=useState("main");
  const curP=pid==="main"?null:pipes.find(p=>p.id===pid);
  const pStages=curP?curP.stages:cfg.stages;
  const inP=l=>curP?(curP.services||[]).includes(l.service):!pipes.some(p=>(p.services||[]).includes(l.service));
  const total=leads.length;
  const w=leads.filter(l=>won.includes(l.stage));
  const active=leads.filter(l=>!won.includes(l.stage)&&!lost.includes(l.stage));
  const wsum=w.reduce((a,l)=>a+(+l.fee||0),0);
  const psum=active.reduce((a,l)=>a+(+l.fee||0),0);
  const conv=total?Math.round(w.length/total*100):0;
  const avg=w.length?Math.round(wsum/w.length):0;
  const byStage=pStages.map(s=>({...s,c:leads.filter(l=>inP(l)&&l.stage===s.name).length}));
  const maxS=Math.max(1,...byStage.map(b=>b.c));
  const bySvc=SERVICES.map(s=>({s,c:leads.filter(l=>l.service===s).length})).filter(x=>x.c);
  const maxSv=Math.max(1,...bySvc.map(x=>x.c));
  const bySrc=Object.keys(SOURCES).map(s=>({s,c:leads.filter(l=>l.source===s).length})).filter(x=>x.c);
  const maxSr=Math.max(1,...bySrc.map(x=>x.c));
  const byM=cfg.managers.map(m=>{const ls=leads.filter(l=>l.manager_id===m.id);return{...m,c:ls.length,w:ls.filter(l=>won.includes(l.stage)).length,sum:ls.filter(l=>won.includes(l.stage)).reduce((a,l)=>a+(+l.fee||0),0)};});
  const recent=[...leads].slice(0,5);
  /* нагадування: активні ліди з датою наступної дії */
  const due=active.filter(l=>l.next_action_at).sort((a,b)=>new Date(a.next_action_at)-new Date(b.next_action_at));
  const overdue=due.filter(l=>naState(l)==="od").length;
  /* причини відмов */
  const lostLeads=leads.filter(l=>lost.includes(l.stage));
  const byLoss=Object.entries(lostLeads.reduce((a,l)=>{const k=lossBase(l.loss_reason)||"Без причини";a[k]=(a[k]||0)+1;return a;},{})).map(([s,c])=>({s,c})).sort((a,b)=>b.c-a.c);
  const maxL=Math.max(1,...byLoss.map(x=>x.c));
  const Kpi=({ic,l,v,s,c})=><div className="kpi"><div className="ic" style={{background:c+"1a",color:c}}>{ic}</div><div className="v">{v}</div><div className="l">{l}</div>{s&&<div className="s">{s}</div>}</div>;
  return <>
    <div className="kpis">
      <Kpi ic="☺" l="Усього лідів" v={total} c="#2563eb"/>
      <Kpi ic="↗" l="Активні угоди" v={active.length} s={uah(psum)} c="#f59e0b"/>
      <Kpi ic="★" l="Конверсія" v={conv+"%"} s={w.length+" реалізовано"} c="#16a34a"/>
      <Kpi ic="₴" l="Виручка (комісії)" v={uah(wsum)} s={"сер. чек "+uah(avg)} c="#8b5cf6"/>
    </div>
    <div className="cols">
      <div className="panel"><div className="ph" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>Ліди по етапах<select className="tsel" value={pid} onChange={e=>setPid(e.target.value)}><option value="main">🚗 Авто</option>{pipes.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div className="bars">{byStage.map(b=><div className="bar" key={b.name}><span className="lbl">{b.name}</span><div className="tr"><div className="fl" style={{width:b.c/maxS*100+"%",background:b.color}}/></div><span className="n">{b.c}</span></div>)}</div></div>
      <div className="panel">
        <div className="ph">Типи послуг</div><div className="bars">{bySvc.length?bySvc.map(x=><div className="bar" key={x.s}><span className="lbl">{x.s}</span><div className="tr"><div className="fl" style={{width:x.c/maxSv*100+"%",background:"#2563eb"}}/></div><span className="n">{x.c}</span></div>):<span className="muted small">Немає даних</span>}</div>
        <div className="ph" style={{marginTop:18}}>Джерела</div><div className="bars">{bySrc.map(x=><div className="bar" key={x.s}><span className="lbl">{x.s}</span><div className="tr"><div className="fl" style={{width:x.c/maxSr*100+"%",background:srcColor(x.s)}}/></div><span className="n">{x.c}</span></div>)}</div>
        <div className="ph" style={{marginTop:18}}>Причини відмов</div><div className="bars">{byLoss.length?byLoss.map(x=><div className="bar" key={x.s}><span className="lbl">{x.s}</span><div className="tr"><div className="fl" style={{width:x.c/maxL*100+"%",background:"#dc2626"}}/></div><span className="n">{x.c}</span></div>):<span className="muted small">Відмов ще немає 👍</span>}</div>
      </div>
    </div>
    <div className="panel"><div className="ph">Менеджери</div><div className="mgrid">{byM.map(m=><div className="mc" key={m.id}><div className="t"><span className="av" style={{background:m.color}}>{m.name[0]}</span><b>{m.name}</b></div><div className="st"><div><b>{m.c}</b><span>лідів</span></div><div><b>{m.w}</b><span>угод</span></div></div><div className="sm">{uah(m.sum)}</div></div>)}</div></div>
    <div className="panel"><div className="ph">⏰ Нагадування {overdue>0&&<span style={{color:"#dc2626",fontSize:13}}>· прострочено: {overdue}</span>}</div>
      <div className="recent">{due.slice(0,8).map(l=>{const st=naState(l);const c=st==="od"?"#dc2626":st==="td"?"#d97706":"#64748b";return <button key={l.id} onClick={()=>openCard(l.id)}>
        <span className="dot" style={{background:c}}>⏰</span>
        <span className="rn">{l.name}</span>
        <span className="muted small" style={{flexShrink:0}}>{l.next_action_note||""}</span>
        <span className="pill" style={{color:c,background:c+"22"}}>{st==="od"?"⚠ ":""}{fdt(l.next_action_at)}</span>
      </button>;})}{!due.length&&<span className="muted small">Запланованих дій немає. Відкрий лід → «Наступна дія», щоб нічого не загубити.</span>}</div></div>
    <div className="panel"><div className="ph">Останні ліди</div><div className="recent">{recent.map(l=>{const st=stOf(cfg,l);return <button key={l.id} onClick={()=>openCard(l.id)}><span className="dot" style={{background:srcColor(l.source)}}>{(l.source||"?")[0]}</span><span className="rn">{l.name}</span><span className="muted small">{l.car_brand} {l.car_model}</span><span className="pill" style={{color:st&&st.color,background:(st?st.color:"#999")+"22"}}>{l.stage}</span><b style={{fontSize:13}}>{uah(l.fee)}</b></button>;})}{!recent.length&&<span className="muted small">Заявок ще немає</span>}</div></div>
  </>;
}

/* ============================ FUNNEL ============================ */
function Funnel({leads,cfg,requestStage,openCard}){
  const pipes=cfg.pipelines||[];
  const [tab,setTab]=useState("main");
  const curP=tab==="main"?null:pipes.find(p=>p.id===tab);
  const stages=curP?curP.stages:cfg.stages;
  const inPipe=l=>curP?(curP.services||[]).includes(l.service):!pipes.some(p=>(p.services||[]).includes(l.service));
  const pl=leads.filter(inPipe);
  const move=(l,dir)=>{const i=stages.findIndex(s=>s.name===l.stage);if(i<0)return;const j=i+dir;if(j<0||j>=stages.length)return;requestStage(l.id,stages[j].name);};
  return <>
    <div className="ptabs">
      <button className={tab==="main"?"on":""} onClick={()=>setTab("main")}>🚗 Авто ({leads.filter(l=>!pipes.some(p=>(p.services||[]).includes(l.service))).length})</button>
      {pipes.map(p=>{const c=leads.filter(l=>(p.services||[]).includes(l.service)).length;return <button key={p.id} className={tab===p.id?"on":""} onClick={()=>setTab(p.id)}>{p.name} ({c})</button>;})}
    </div>
    <div className="kanban">{stages.map(s=>{
    const col=pl.filter(l=>l.stage===s.name);const sum=col.reduce((a,l)=>a+(+l.fee||0),0);
    return <div className="col" key={s.name}>
      <div className="colh" style={{borderTopColor:s.color}}><span className="cd" style={{background:s.color}}/><span className="nm">{s.name}</span><span className="ct">{col.length}</span></div>
      <div className="colsum">{uah(sum)}</div>
      <div className="colb">{col.map(l=>{const m=cfg.managers.find(x=>x.id===l.manager_id);const na=s.type==="active"?naState(l):null;return <div className={"kc"+(na==="od"?" od":"")} key={l.id} onClick={()=>openCard(l.id)}>
        <div className="top"><span className="nm">{l.name}</span><span className="dot" style={{background:srcColor(l.source),width:20,height:20}}>{(l.source||"?")[0]}</span></div>
        <div className="meta">{l.car_brand} {l.car_model} {l.car_year||""}</div>
        <div className="b">{uah(l.fee)}</div>
        {na&&<div className={"na "+na}>⏰ {fdt(l.next_action_at)}{l.next_action_note?" · "+l.next_action_note:""}</div>}
        <div className="ft">{m&&<span className="mini" style={{background:m.color}}>{m.name[0]}</span>}<span className="mg">{m?m.name:"—"}</span><span className="mv"><button onClick={e=>{e.stopPropagation();move(l,-1);}}>‹</button><button onClick={e=>{e.stopPropagation();move(l,1);}}>›</button></span></div>
      </div>;})}{!col.length&&<div className="muted small" style={{textAlign:"center",padding:14}}>Порожньо</div>}</div>
    </div>;
  })}</div>
  </>;
}

/* ============================ LEADS TABLE ============================ */
function Leads({leads,cfg,openCard}){
  const [q,setQ]=useState(""),[fs,setFs]=useState(""),[fm,setFm]=useState(""),[fsv,setFsv]=useState("");
  const rows=useMemo(()=>leads.filter(l=>{
    if(fs&&l.stage!==fs)return false; if(fm&&l.manager_id!==fm)return false; if(fsv&&l.service!==fsv)return false;
    if(q){const t=((l.name||"")+(l.phone||"")+(l.car_brand||"")+(l.car_model||"")+(l.vin||"")+(l.city||"")).toLowerCase();if(!t.includes(q.toLowerCase()))return false;}
    return true;
  }),[leads,q,fs,fm,fsv]);
  return <>
    <div className="filters">
      <div className="search"><span className="muted">⌕</span><input placeholder="Пошук: клієнт, телефон, авто, VIN…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <select value={fs} onChange={e=>setFs(e.target.value)}><option value="">Усі етапи</option>{[...new Set(allStages(cfg).map(s=>s.name))].map(n=><option key={n}>{n}</option>)}</select>
      <select value={fsv} onChange={e=>setFsv(e.target.value)}><option value="">Усі послуги</option>{SERVICES.map(s=><option key={s}>{s}</option>)}</select>
      <select value={fm} onChange={e=>setFm(e.target.value)}><option value="">Усі менеджери</option>{cfg.managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
    </div>
    <div className="panel np"><div className="tw"><table>
      <thead><tr><th>Клієнт</th><th>Авто</th><th>Послуга</th><th>Комісія</th><th>Менеджер</th><th>Етап</th><th>Дата</th></tr></thead>
      <tbody>{rows.map(l=>{const s=stOf(cfg,l);const m=cfg.managers.find(x=>x.id===l.manager_id);return <tr key={l.id} onClick={()=>openCard(l.id)}>
        <td><div className="tn">{l.name}</div><div className="ts">{l.phone}</div></td>
        <td><div className="tn">{l.car_brand} {l.car_model}</div><div className="ts">{l.car_year} {l.origin?"· "+l.origin:""}</div></td>
        <td>{l.service||"—"}</td><td className="tn">{uah(l.fee)}</td>
        <td>{m?<span style={{display:"inline-flex",alignItems:"center",gap:6}}><span className="mini" style={{background:m.color}}>{m.name[0]}</span>{m.name}</span>:"—"}</td>
        <td><span className="pill" style={{color:s&&s.color,background:(s?s.color:"#999")+"22"}}>{l.stage}</span></td>
        <td className="muted">{fdate(l.created_at)}{(()=>{const na=naState(l);if(!na)return null;const c=na==="od"?"#dc2626":na==="td"?"#d97706":"#94a3b8";return <div style={{fontSize:11,fontWeight:700,color:c,marginTop:3}}>⏰ {fdt(l.next_action_at)}</div>;})()}</td>
      </tr>;})}</tbody>
    </table>{!rows.length&&<div className="muted" style={{textAlign:"center",padding:30}}>Нічого не знайдено</div>}</div></div>
    <div className="muted small">Показано {rows.length} із {leads.length}</div>
  </>;
}

/* ============================ MANAGERS ============================ */
function Managers({leads,cfg,saveCfg,updateLead}){
  const won=typeNames(cfg,"won");
  const [name,setName]=useState("");
  const pal=["#2563eb","#10b981","#f59e0b","#8b5cf6","#ec4899","#0891b2","#ef4444","#84cc16"];
  const unassigned=leads.filter(l=>!l.manager_id);
  const add=()=>{if(!name.trim())return;saveCfg({...cfg,managers:[...cfg.managers,{id:uid(),name:name.trim(),color:pal[cfg.managers.length%pal.length]}]});setName("");};
  const ren=(id,v)=>saveCfg({...cfg,managers:cfg.managers.map(m=>m.id===id?{...m,name:v}:m)});
  const rm=(id)=>saveCfg({...cfg,managers:cfg.managers.filter(m=>m.id!==id)});
  const distribute=async()=>{if(!cfg.managers.length)return;let i=0;for(const l of unassigned){const m=cfg.managers[i%cfg.managers.length];i++;await updateLead(l.id,{manager_id:m.id},`Авторозподіл → ${m.name}`);}};
  return <>
    <div className="panel"><div className="ph">Розподіл лідів</div><p className="muted small" style={{marginBottom:12}}>Нерозподілених: <b>{unassigned.length}</b>. Авторозподіл призначить їх по черзі.</p><button className="btn p" onClick={distribute} disabled={!unassigned.length}>Авторозподілити ({unassigned.length})</button></div>
    <div className="panel"><div className="ph">Команда</div>
      <div className="addrow"><input placeholder="Ім'я менеджера" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/><button className="btn p" onClick={add}>+ Додати</button></div>
      {cfg.managers.map(m=>{const ls=leads.filter(l=>l.manager_id===m.id);const ws=ls.filter(l=>won.includes(l.stage)).reduce((a,l)=>a+(+l.fee||0),0);return <div className="mline" key={m.id}><span className="av" style={{background:m.color}}>{m.name[0]}</span><input className="gi" value={m.name} onChange={e=>ren(m.id,e.target.value)}/><span className="muted small">{ls.length} · {uah(ws)}</span><button className="ib d" onClick={()=>rm(m.id)}>🗑</button></div>;})}
      <p className="note" style={{marginTop:14}}>Щоб менеджер міг заходити в CRM — створи йому акаунт у Supabase → Authentication → Add user (email + пароль). Імена тут і акаунти в Supabase — це різні речі: тут лише для воронки й аналітики.</p>
    </div>
  </>;
}

/* ============================ SETTINGS ============================ */
function Settings({cfg,saveCfg}){
  const [ns,setNs]=useState("");
  const pipes=cfg.pipelines||[];
  const [pid,setPid]=useState("main");
  const stages=pid==="main"?cfg.stages:((pipes.find(p=>p.id===pid)||{}).stages||[]);
  const setStages=next=>{ if(pid==="main") saveCfg({...cfg,stages:next}); else saveCfg({...cfg,pipelines:pipes.map(p=>p.id===pid?{...p,stages:next}:p)}); };
  const pal=["#64748b","#3b82f6","#6366f1","#8b5cf6","#0891b2","#d97706","#ea580c","#0d9488","#0ea5e9","#16a34a","#dc2626"];
  const ren=(i,v)=>setStages(stages.map((s,k)=>k===i?{...s,name:v}:s));
  const col=(i,v)=>setStages(stages.map((s,k)=>k===i?{...s,color:v}:s));
  const typ=(i,v)=>setStages(stages.map((s,k)=>k===i?{...s,type:v}:s));
  const rm=(i)=>setStages(stages.filter((_,k)=>k!==i));
  const addS=()=>{if(!ns.trim())return;setStages([...stages,{name:ns.trim(),color:pal[stages.length%pal.length],type:"active"}]);setNs("");};
  const mv=(i,d)=>{const a=[...stages];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setStages(a);};
  const curP=pid==="main"?null:pipes.find(p=>p.id===pid);
  return <>
    <div className="panel"><div className="ph">Загальні</div><label className="field"><span>Назва CRM</span><input value={cfg.title} onChange={e=>saveCfg({...cfg,title:e.target.value})}/></label></div>
    <div className="panel"><div className="ph">Воронки продажів</div>
      <div className="ptabs" style={{marginBottom:14}}>
        <button className={pid==="main"?"on":""} onClick={()=>setPid("main")}>🚗 Авто</button>
        {pipes.map(p=><button key={p.id} className={pid===p.id?"on":""} onClick={()=>setPid(p.id)}>{p.name}</button>)}
      </div>
      <p className="muted small" style={{marginBottom:12}}>{curP?<>Воронка для послуг: <b>{(curP.services||[]).join(", ")}</b>. Решта послуг ідуть у воронку «Авто».</>:"Головна воронка: підбір авто, авто зі США, супровід угоди та інші послуги без окремої воронки."} Назва, колір, порядок, тип етапу. Тип впливає на аналітику.</p>
      {stages.map((s,i)=><div className="stl" key={i}><input type="color" className="ci" value={s.color} onChange={e=>col(i,e.target.value)}/><input className="gi" value={s.name} onChange={e=>ren(i,e.target.value)}/><select className="tsel" value={s.type} onChange={e=>typ(i,e.target.value)}><option value="active">активний</option><option value="won">виграно</option><option value="lost">втрачено</option></select><div className="reord"><button onClick={()=>mv(i,-1)}>▲</button><button onClick={()=>mv(i,1)}>▼</button></div><button className="ib d" onClick={()=>rm(i)}>🗑</button></div>)}
      <div className="addrow" style={{marginTop:12}}><input placeholder="Назва нового етапу" value={ns} onChange={e=>setNs(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addS()}/><button className="btn p" onClick={addS}>+ Етап</button></div>
    </div>
    <div className="panel"><div className="ph">Інтеграція</div><p className="note">Заявки з сайту вже надходять у воронку (джерело «Сайт»). Лід автоматично потрапляє у воронку своєї послуги: Розмитнення, Договір, Оцінка, Оцінка + договір — окремі воронки, решта — «Авто». Для реклами Meta/TikTok/Google — налаштуй вебхук на endpoint, що пише в таблицю <b>leads</b> (як це робить форма на сайті).</p></div>
  </>;
}

/* ============================ LOSS MODAL ============================ */
function LossModal({onClose,onConfirm}){
  const [r,setR]=useState("");
  const [t,setT]=useState("");
  const submit=()=>{
    if(!r){alert("Обери причину відмови");return;}
    onConfirm(r+(t.trim()?" — "+t.trim():""));
  };
  return <div className="overlay c" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <h3>Чому втратили лід?</h3>
    <p className="sub">Причина збережеться в картці та піде в аналітику відмов.</p>
    <div className="rlist">{LOSS_REASONS.map(x=><button key={x} className={r===x?"sel":""} onClick={()=>setR(x)}>{x}</button>)}</div>
    <textarea rows={2} placeholder="Коментар (необов'язково)…" value={t} onChange={e=>setT(e.target.value)}/>
    <div className="fa" style={{marginTop:14}}><button className="btn g" onClick={onClose}>Скасувати</button><button className="btn p" onClick={submit}>Підтвердити відмову</button></div>
  </div></div>;
}

/* ============================ CARD ============================ */
function Card({lead,cfg,onClose,updateLead,requestStage,delLead}){
  const [edit,setEdit]=useState(false);
  const [f,setF]=useState(lead);
  const [c,setC]=useState("");
  const [na,setNa]=useState(toLocal(lead.next_action_at));
  const [nn,setNn]=useState(lead.next_action_note||"");
  useEffect(()=>{setF(lead);setNa(toLocal(lead.next_action_at));setNn(lead.next_action_note||"");},[lead.id]);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setService=v=>setF(p=>{const ps=pipeFor(cfg,v);const stage=ps.some(s=>s.name===p.stage)?p.stage:ps[0].name;return {...p,service:v,stage};});
  const save=()=>{
    const ch=[];if(f.stage!==lead.stage)ch.push("етап → "+f.stage);
    const m1=cfg.managers.find(m=>m.id===f.manager_id);const m0=cfg.managers.find(m=>m.id===lead.manager_id);
    if(f.manager_id!==lead.manager_id)ch.push("менеджер → "+(m1?m1.name:"—"));
    /* якщо новий етап типу "lost" — зберігаємо все, крім етапу, а етап міняємо через requestStage (з причиною) */
    const newSt=pipeFor(cfg,f.service).find(s=>s.name===f.stage)||allStages(cfg).find(s=>s.name===f.stage);
    const toLost=newSt&&newSt.type==="lost"&&f.stage!==lead.stage;
    const patch={name:f.name,phone:f.phone,email:f.email,city:f.city,client_type:f.client_type,service:f.service,car_brand:f.car_brand,car_model:f.car_model,car_year:+f.car_year||null,vin:f.vin,mileage:+f.mileage||null,origin:f.origin,car_budget:+f.car_budget||null,fee:+f.fee||null,source:f.source,manager_id:f.manager_id,notes:f.notes};
    if(!toLost)patch.stage=f.stage;
    updateLead(lead.id,patch,"Картку оновлено"+(ch.filter(x=>!toLost||!x.startsWith("етап")).length?": "+ch.filter(x=>!toLost||!x.startsWith("етап")).join(", "):""));
    if(toLost)requestStage(lead.id,f.stage);
    setEdit(false);
  };
  const addC=()=>{if(!c.trim())return;updateLead(lead.id,{},"💬 "+c.trim());setC("");};
  const saveNa=()=>{
    if(!na){alert("Вкажи дату та час");return;}
    updateLead(lead.id,{next_action_at:new Date(na).toISOString(),next_action_note:nn.trim()||null},"⏰ Наступна дія: "+fdt(new Date(na).toISOString())+(nn.trim()?" · "+nn.trim():""));
  };
  const doneNa=()=>{
    updateLead(lead.id,{next_action_at:null,next_action_note:null},"✓ Дію виконано"+(lead.next_action_note?": "+lead.next_action_note:""));
    setNa("");setNn("");
  };
  const st=stOf(cfg,lead);
  const myStages=pipeFor(cfg,lead.service);
  const naSt=st&&st.type==="active"?naState(lead):null;
  return <div className="overlay" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
    <div className="sh"><div><div className="ttl">{lead.name}</div><div className="muted small">{lead.service} · {fdate(lead.created_at)} · {lead.source}</div></div>
      <div style={{display:"flex",gap:7}}>{!edit&&<button className="x" onClick={()=>setEdit(true)}>✎</button>}<button className="x" onClick={()=>{if(confirm("Видалити лід?"))delLead(lead.id);}}>🗑</button><button className="x" onClick={onClose}>×</button></div></div>
    <div className="sb">
      <span className="pill" style={{color:st&&st.color,background:(st?st.color:"#999")+"22",fontSize:13,padding:"6px 13px"}}>{lead.stage}</span>
      {!edit?<div className="ig" style={{marginTop:16}}>
        <I l="Телефон" v={lead.phone}/><I l="Email" v={lead.email||"—"}/><I l="Місто" v={lead.city||"—"}/><I l="Тип клієнта" v={lead.client_type||"—"}/>
        <I l="Авто" v={`${lead.car_brand||""} ${lead.car_model||""} ${lead.car_year||""}`}/><I l="Походження" v={lead.origin||"—"}/>
        <I l="VIN" v={lead.vin||"—"}/><I l="Пробіг" v={lead.mileage?(+lead.mileage).toLocaleString("uk-UA")+" км":"—"}/>
        <I l="Бюджет на авто" v={lead.car_budget?usd(lead.car_budget):"—"}/><I l="Комісія / вартість" v={uah(lead.fee)}/>
        <I l="Менеджер" v={(cfg.managers.find(m=>m.id===lead.manager_id)||{}).name||"не призначено"}/>
        {lead.notes&&<div style={{gridColumn:"1/-1"}}><span className="muted small">Примітки</span><p style={{fontSize:13.5,marginTop:4}}>{lead.notes}</p></div>}
      </div>:<div className="fg" style={{marginTop:16}}>
        <F l="Ім'я"><input value={f.name||""} onChange={e=>set("name",e.target.value)}/></F>
        <F l="Телефон"><input value={f.phone||""} onChange={e=>set("phone",e.target.value)}/></F>
        <F l="Email"><input value={f.email||""} onChange={e=>set("email",e.target.value)}/></F>
        <F l="Місто"><input value={f.city||""} onChange={e=>set("city",e.target.value)}/></F>
        <F l="Тип клієнта"><select value={f.client_type||"Фіз. особа"} onChange={e=>set("client_type",e.target.value)}><option>Фіз. особа</option><option>Юр. особа</option></select></F>
        <F l="Послуга"><select value={f.service||""} onChange={e=>setService(e.target.value)}>{SERVICES.map(s=><option key={s}>{s}</option>)}</select></F>
        <F l="Марка"><input value={f.car_brand||""} onChange={e=>set("car_brand",e.target.value)}/></F>
        <F l="Модель"><input value={f.car_model||""} onChange={e=>set("car_model",e.target.value)}/></F>
        <F l="Рік"><input type="number" value={f.car_year||""} onChange={e=>set("car_year",e.target.value)}/></F>
        <F l="Походження"><select value={f.origin||""} onChange={e=>set("origin",e.target.value)}><option value="">—</option>{ORIGINS.map(o=><option key={o}>{o}</option>)}</select></F>
        <F l="VIN" full><input value={f.vin||""} onChange={e=>set("vin",e.target.value)}/></F>
        <F l="Пробіг, км"><input type="number" value={f.mileage||""} onChange={e=>set("mileage",e.target.value)}/></F>
        <F l="Бюджет, $"><input type="number" value={f.car_budget||""} onChange={e=>set("car_budget",e.target.value)}/></F>
        <F l="Комісія, грн"><input type="number" value={f.fee||""} onChange={e=>set("fee",e.target.value)}/></F>
        <F l="Джерело"><select value={f.source||""} onChange={e=>set("source",e.target.value)}>{Object.keys(SOURCES).map(s=><option key={s}>{s}</option>)}</select></F>
        <F l="Етап"><select value={f.stage} onChange={e=>set("stage",e.target.value)}>{pipeFor(cfg,f.service).map(s=><option key={s.name}>{s.name}</option>)}</select></F>
        <F l="Менеджер"><select value={f.manager_id||""} onChange={e=>set("manager_id",e.target.value)}><option value="">не призначено</option>{cfg.managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></F>
        <F l="Примітки" full><textarea rows={3} value={f.notes||""} onChange={e=>set("notes",e.target.value)}/></F>
        <div className="fa full"><button className="btn g" onClick={()=>{setF(lead);setEdit(false);}}>Скасувати</button><button className="btn p" onClick={save}>Зберегти</button></div>
      </div>}
      {!edit&&<>
        {lead.loss_reason&&<div className="lr">Причина відмови: <b>{lead.loss_reason}</b></div>}
        <div className="qs"><span className="muted small">Швидко етап:</span><select value={lead.stage} onChange={e=>requestStage(lead.id,e.target.value)}>{!myStages.some(s=>s.name===lead.stage)&&<option>{lead.stage}</option>}{myStages.map(s=><option key={s.name}>{s.name}</option>)}</select></div>
        <div className="rem">
          <div className="rt">⏰ Наступна дія {naSt==="od"&&<span style={{color:"#dc2626"}}>· прострочено!</span>}{naSt==="td"&&<span style={{color:"#d97706"}}>· сьогодні</span>}</div>
          <div className="rr">
            <input type="datetime-local" value={na} onChange={e=>setNa(e.target.value)}/>
            <input type="text" placeholder="Що зробити: подзвонити, надіслати КП…" value={nn} onChange={e=>setNn(e.target.value)}/>
          </div>
          <div style={{display:"flex",gap:8,marginTop:9}}>
            <button className="btn p" style={{padding:"8px 13px",fontSize:13}} onClick={saveNa}>Зберегти</button>
            {lead.next_action_at&&<button className="btn g" style={{padding:"8px 13px",fontSize:13}} onClick={doneNa}>✓ Виконано</button>}
          </div>
        </div>
        <div className="tl"><div className="ph" style={{fontSize:14}}>Історія та коментарі</div>
          <div className="crow"><input placeholder="Додати коментар…" value={c} onChange={e=>setC(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addC()}/><button className="btn p" onClick={addC}>→</button></div>
          <ul>{[...(lead.history||[])].reverse().map((h,i)=><li key={i}><span className="d"/><div><p>{h.text}</p><time>{fdate(h.ts)}</time></div></li>)}</ul>
        </div>
      </>}
    </div>
  </div></div>;
}

/* ============================ ADD LEAD ============================ */
function AddLead({cfg,onClose,addLead}){
  const [f,setF]=useState({name:"",phone:"",email:"",city:"",client_type:"Фіз. особа",service:"Підбір авто",car_brand:"",car_model:"",car_year:"",vin:"",origin:"США",car_budget:"",fee:"",source:"CRM",manager_id:"",stage:cfg.stages[0].name});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setService=v=>setF(p=>{const ps=pipeFor(cfg,v);const stage=ps.some(s=>s.name===p.stage)?p.stage:ps[0].name;return {...p,service:v,stage};});
  const submit=()=>{if(!f.name.trim()){alert("Вкажіть ім'я");return;}addLead({...f,car_year:+f.car_year||null,car_budget:+f.car_budget||null,fee:+f.fee||null});};
  return <div className="overlay" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
    <div className="sh"><div className="ttl">Новий лід</div><button className="x" onClick={onClose}>×</button></div>
    <div className="sb"><div className="fg">
      <F l="Ім'я клієнта"><input value={f.name} onChange={e=>set("name",e.target.value)} autoFocus/></F>
      <F l="Телефон"><input value={f.phone} onChange={e=>set("phone",e.target.value)}/></F>
      <F l="Email"><input value={f.email} onChange={e=>set("email",e.target.value)}/></F>
      <F l="Місто"><input value={f.city} onChange={e=>set("city",e.target.value)}/></F>
      <F l="Тип клієнта"><select value={f.client_type} onChange={e=>set("client_type",e.target.value)}><option>Фіз. особа</option><option>Юр. особа</option></select></F>
      <F l="Послуга"><select value={f.service} onChange={e=>setService(e.target.value)}>{SERVICES.map(s=><option key={s}>{s}</option>)}</select></F>
      <F l="Марка"><input value={f.car_brand} onChange={e=>set("car_brand",e.target.value)}/></F>
      <F l="Модель"><input value={f.car_model} onChange={e=>set("car_model",e.target.value)}/></F>
      <F l="Рік"><input type="number" value={f.car_year} onChange={e=>set("car_year",e.target.value)}/></F>
      <F l="Походження"><select value={f.origin} onChange={e=>set("origin",e.target.value)}>{ORIGINS.map(o=><option key={o}>{o}</option>)}</select></F>
      <F l="VIN" full><input value={f.vin} onChange={e=>set("vin",e.target.value)}/></F>
      <F l="Бюджет, $"><input type="number" value={f.car_budget} onChange={e=>set("car_budget",e.target.value)}/></F>
      <F l="Комісія, грн"><input type="number" value={f.fee} onChange={e=>set("fee",e.target.value)}/></F>
      <F l="Етап"><select value={f.stage} onChange={e=>set("stage",e.target.value)}>{pipeFor(cfg,f.service).map(s=><option key={s.name}>{s.name}</option>)}</select></F>
      <F l="Менеджер"><select value={f.manager_id} onChange={e=>set("manager_id",e.target.value)}><option value="">авто (по черзі)</option>{cfg.managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></F>
      <div className="fa full"><button className="btn g" onClick={onClose}>Скасувати</button><button className="btn p" onClick={submit}>+ Створити</button></div>
    </div></div>
  </div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
